name: Release

# When a GitHub release vX.Y.Z is published, the major tag (v1 for v1.4.2)
# moves to it, so `uses: transcodeworks/setup-roadcase@v1` follows every
# release of that major version. A prerelease moves nothing, and neither does
# a release older than the newest of its major version.
#
# The workflow's own token moves the tag, so the repository's tag ruleset must
# leave the major tags to it: protect `refs/tags/v*.*.*` (the releases, which
# never move), not `refs/tags/v*`. README.md, Releasing.

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the major tag to this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not vX.Y.Z: no major tag moves."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft or .prerelease | not) | .tag_name' |
            grep -E "^$major\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$TAG is older than $newest: $major stays where it is."
            exit 0
          fi
          # The commit the release's tag names, through an annotated tag too.
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              -f sha="$commit" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$commit" >/dev/null
          fi
          echo "::notice::$major is now $TAG ($commit)."
